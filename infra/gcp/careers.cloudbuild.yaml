# Construye la imagen del ATS para Cloud Run (PostgREST como sidecar sobre la
# base `careers` de Cloud SQL, archivos en Cloud Storage, IA por Vertex).
#
#   gcloud builds submit . --config infra/gcp/careers.cloudbuild.yaml \
#     --project wellness-experience-management --region us-west1 \
#     --service-account projects/wellness-experience-management/serviceAccounts/sa-build@wellness-experience-management.iam.gserviceaccount.com \
#     --substitutions _TAG=gcp-stg,_APP_URL=http://localhost:8081
#
# La llave anon se firma aquí con el secreto JWT de PostgREST; el navegador no
# habla con Supabase, solo el servidor.

substitutions:
  _TAG: gcp-stg
  # Vacío en builds a mano. El trigger de main lo fija al servicio de staging
  # para que cada push quede desplegado sin pasar por el Mac.
  _SERVICIO: ""
  _APP_URL: http://localhost:8081
  _IMAGEN: us-west1-docker.pkg.dev/wellness-experience-management/trading/careers

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

availableSecrets:
  secretManager:
    - versionName: projects/wellness-experience-management/secrets/prod-careers-postgrest-jwt-secret/versions/latest
      env: JWT_SECRET

steps:
  - id: llave-anon
    name: python:3.12-slim
    secretEnv: [JWT_SECRET]
    entrypoint: python3
    args:
      - -c
      - |
        import base64, hashlib, hmac, json, os, time
        b = lambda d: base64.urlsafe_b64encode(d).rstrip(b"=").decode()
        ahora = int(time.time())
        cuerpo = b(json.dumps({"alg": "HS256", "typ": "JWT"}).encode()) + "." + b(json.dumps(
            {"role": "anon", "iss": "careers", "iat": ahora, "exp": ahora + 10 * 365 * 86400}).encode())
        firma = b(hmac.new(os.environ["JWT_SECRET"].encode(), cuerpo.encode(), hashlib.sha256).digest())
        open("/workspace/anon_key", "w").write(cuerpo + "." + firma)

  - id: imagen
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        docker build -t ${_IMAGEN}:${_TAG} \
          --build-arg NEXT_PUBLIC_SUPABASE_URL=http://127.0.0.1:3001 \
          --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY="$(cat /workspace/anon_key)" \
          --build-arg NEXT_PUBLIC_APP_URL=${_APP_URL} \
          . && docker push ${_IMAGEN}:${_TAG}

  - id: desplegar
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        if [ -z "${_SERVICIO}" ]; then echo "Sin _SERVICIO: solo imagen."; exit 0; fi
        gcloud run services update ${_SERVICIO} --container careers --image ${_IMAGEN}:${_TAG} --region us-west1 --project $PROJECT_ID
